# Per-model overrides for the llama-router (--models-dir /ai/models).
# ctx-size used to be set globally on llama-router.service's ExecStart,
# which meant every model shared one context size (router CLI args always
# win over a preset's value for the same key, per server-models.cpp). It
# was moved here, per model, so Qwen3.8-27B-UD-Q4_K_XL can run a bigger
# context than the other two without growing their VRAM footprint too.

[Qwen3.6-27B-Q6_K]
ctx-size = 98304

[Qwen3.8-27B-CIRU-ActiveFPX-PromptForge]
ctx-size = 98304

[Qwen3.8-27B-UD-Q4_K_XL]
ctx-size = 163840
threads = 6
threads-batch = 6
flash-attn = on
cache-type-k = f16
cache-type-v = f16
kv-unified = 1
load-mode = none
split-mode = none
n-cpu-moe = 0
spec-type = draft-mtp
spec-draft-n-max = 2
spec-draft-p-min = 0.3

# Same tuning as Q4_K_XL above so the two are directly comparable.
# ctx-size differs by necessity: Q6 weights are 24.1 GiB vs Q4's 16.7 GiB,
# so there is only ~5-6 GiB left for KV cache instead of ~10 GiB.
# KV costs ~64 KiB/token here (16 full-attn layers of 65, f16, 4 KV heads),
# so 65536 tokens = ~4 GiB and leaves headroom. Any Q4-vs-Q6 speed
# comparison must state both context sizes.
[Qwen3.8-27B-UD-Q6_K_XL]
ctx-size = 65536
threads = 6
threads-batch = 6
flash-attn = on
cache-type-k = f16
cache-type-v = f16
kv-unified = 1
load-mode = none
split-mode = none
n-cpu-moe = 0
spec-type = draft-mtp
spec-draft-n-max = 2
spec-draft-p-min = 0.3
